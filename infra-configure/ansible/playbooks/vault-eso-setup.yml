---
- name: Automate Vault and ESO Setup on K3s Master Node
  hosts: role_Master
  become: yes
  environment:
    KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

  tasks:
    - name: 1. Add and Update HashiCorp Helm Repository
      ansible.builtin.shell: helm repo add hashicorp https://helm.releases.hashicorp.com && helm repo update
      changed_when: false

    - name: 2. Install HashiCorp Vault in Dev Mode
      ansible.builtin.shell: |
        helm upgrade --install vault hashicorp/vault \
          --namespace vault --create-namespace \
          --set "server.dev.enabled=true"
      
    - name: 3. Wait for Vault Pod to be Ready (Takes about 30 seconds)
      ansible.builtin.shell: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=vault -n vault --timeout=120s
      changed_when: false

    - name: 4. Add and Update External Secrets Operator (ESO) Repo
      ansible.builtin.shell: helm repo add external-secrets https://charts.external-secrets.io && helm repo update
      changed_when: false

    - name: 5. Install External Secrets Operator (ESO)
      ansible.builtin.shell: |
        helm upgrade --install external-secrets external-secrets/external-secrets \
          --namespace external-secrets --create-namespace \
          --set installCRDs=true

    - name: 6. Copy secrets.json from Laptop to AWS Master Node temporarily
      ansible.builtin.copy:
        src: "../secrets.json" 
        dest: "/tmp/secrets.json"

    - name: 7. Copy secrets.json from Master Node into Vault Pod
      ansible.builtin.shell: |
        kubectl cp /tmp/secrets.json vault/vault-0:/tmp/secrets.json
      changed_when: false

    - name: 8. Inject Bulk Secrets into HashiCorp Vault using JSON
      ansible.builtin.shell: |
        kubectl exec -n vault vault-0 -- sh -c 'vault kv put secret/x-shop/backend @/tmp/secrets.json'
      register: vault_secrets

    - name: 9. Security Cleanup - Delete secrets.json from Vault Pod
      ansible.builtin.shell: |
        kubectl exec -n vault vault-0 -- rm /tmp/secrets.json
      changed_when: false

    - name: 10. Security Cleanup - Delete secrets.json from AWS Master Node
      ansible.builtin.file:
        path: "/tmp/secrets.json"
        state: absent

    - name: 11. Display Vault Success Message
      ansible.builtin.debug:
        msg: "Bulk Secrets added successfully to Vault and temporary files are cleaned up securely!"
