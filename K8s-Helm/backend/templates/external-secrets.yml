apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.appName }}-external-secret
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: vault-backend-store
    kind: SecretStore
  target:
    name: {{ .Values.appName }}-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: xshop/backend
    rewrite:
    - regexp:
        source: " "
        target: "_"
