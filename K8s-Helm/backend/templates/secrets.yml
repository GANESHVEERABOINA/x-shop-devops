{{- if not .Values.vault.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appName }}-secret
type: Opaque
stringData:
  PORT: {{ .Values.secrets.PORT | default "4000" | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | default "" | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.ADMIN_EMAIL | default "" | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.ADMIN_PASSWORD | default "" | quote }}
  MONGODB_URI: {{ .Values.secrets.MONGODB_URI | default "" | quote }}
  CLOUDINARY_API_KEY: {{ .Values.secrets.CLOUDINARY_API_KEY | default "" | quote }}
  CLOUDINARY_SECRET_KEY: {{ .Values.secrets.CLOUDINARY_SECRET_KEY | default "" | quote }}
  CLOUDINARY_NAME: {{ .Values.secrets.CLOUDINARY_NAME | default "" | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.STRIPE_SECRET_KEY | default "" | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.secrets.RAZORPAY_KEY_SECRET | default "" | quote }}
  RAZORPAY_KEY_ID: {{ .Values.secrets.RAZORPAY_KEY_ID | default "" | quote }}
{{- end }}
