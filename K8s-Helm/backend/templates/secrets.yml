apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appName }}-secret
type: Opaque
stringData:
  PORT: "{{ .Values.secrets.PORT }}"
  JWT_SECRET: "{{ .Values.secrets.JWT_SECRET }}"
  ADMIN_EMAIL: "{{ .Values.secrets.ADMIN_EMAIL }}"
  ADMIN_PASSWORD: "{{ .Values.secrets.ADMIN_PASSWORD }}"
  MONGODB_URI: "{{ .Values.secrets.MONGODB_URI }}"
  CLOUDINARY_API_KEY: "{{ .Values.secrets.CLOUDINARY_API_KEY }}"
  CLOUDINARY_SECRET_KEY: "{{ .Values.secrets.CLOUDINARY_SECRET_KEY }}"
  CLOUDINARY_NAME: "{{ .Values.secrets.CLOUDINARY_NAME }}"
  STRIPE_SECRET_KEY: "{{ .Values.secrets.STRIPE_SECRET_KEY }}"
  RAZORPAY_KEY_SECRET: "{{ .Values.secrets.RAZORPAY_KEY_SECRET }}"
  RAZORPAY_KEY_ID: "{{ .Values.secrets.RAZORPAY_KEY_ID }}"
